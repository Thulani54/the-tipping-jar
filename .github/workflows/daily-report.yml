name: Nightly Daily Report

# Runs at 22:00 UTC every night = 00:00 SAST (UTC+2)
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date override (YYYY-MM-DD, SAST). Defaults to yesterday."
        required: false
        default: ""
      dry_run:
        description: "Dry run — print without sending emails"
        type: boolean
        required: false
        default: false

env:
  BACKEND_URL: https://api.tippingjar.co.za

jobs:
  send-daily-report:
    name: Send nightly transaction report
    runs-on: ubuntu-latest

    steps:
      - name: Build request body
        id: body
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DATE_VAL=""
          if [ -n "$INPUT_DATE" ]; then
            # Validate format (YYYY-MM-DD only) to prevent injection
            if echo "$INPUT_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              DATE_VAL="$INPUT_DATE"
            else
              echo "::error::Invalid date format: $INPUT_DATE"
              exit 1
            fi
          fi

          DRY_RUN="false"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN="true"
          fi

          if [ -n "$DATE_VAL" ]; then
            BODY="{\"date\":\"${DATE_VAL}\",\"dry_run\":${DRY_RUN}}"
          else
            BODY="{\"dry_run\":${DRY_RUN}}"
          fi
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

      - name: Call daily report endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REQUEST_BODY: ${{ steps.body.outputs.body }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --data "${REQUEST_BODY}" \
            "${BACKEND_URL}/api/cron/daily-report/")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "=== Response (HTTP $HTTP_CODE) ==="
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Daily report failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Surface summary in the logs
          SENT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('emails_sent',0))" 2>/dev/null || echo "?")
          FOUND=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('creators_found',0))" 2>/dev/null || echo "?")
          echo "✓ Reports sent: $SENT / $FOUND creators"
